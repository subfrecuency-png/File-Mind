name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  safety-lint:
    name: no hard deletes in core
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Core safety rule: the only deletion primitive is OsAdapter::move_to_trash.
      # FileMind's own control files (socket, stop file) are annotated `filemind:own-file`.
      - run: |
          if grep -rnE 'fs::(remove_file|remove_dir|remove_dir_all)\b' crates/core/src crates/agent/src crates/cli/src | grep -v 'filemind:own-file'; then
            echo "::error::Hard delete found outside the OS adapter layer"; exit 1; fi

  desktop:
    name: desktop app (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
        working-directory: apps/desktop
      - run: npm run build
        working-directory: apps/desktop
      # tauri-build refuses to compile without the sidecars in place
      - run: sh scripts/build-sidecar.sh --debug
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: apps/desktop/src-tauri

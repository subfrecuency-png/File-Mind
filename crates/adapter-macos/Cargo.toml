[package]
name = "filemind-adapter-macos"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
filemind-core = { path = "../core" }
anyhow.workspace = true
tracing.workspace = true
chrono.workspace = true
walkdir.workspace = true
directories.workspace = true
notify.workspace = true
flate2.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true
# OSX_10_15: data-protection Keychain so vault-mk can set
# kSecAttrAccessibleWhenUnlockedThisDeviceOnly via SecAccessControl.
security-framework = { version = "3", features = ["OSX_10_15"] }

[dev-dependencies]
tempfile.workspace = true

[package]
name = "filemind-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

build = "build.rs"

[lib]
path = "src/lib.rs"

[[bin]]
name = "filemind-agent"
path = "src/main.rs"

[dependencies]
filemind-core = { path = "../core" }
blake3.workspace = true
filemind-storage = { path = "../storage" }
filemind-ai = { path = "../ai" }
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
directories.workspace = true
rusqlite.workspace = true
ureq = { version = "3", features = ["json"] }

[target.'cfg(unix)'.dependencies]
filemind-adapter-macos = { path = "../adapter-macos" }
libc.workspace = true
# SQLCipher at rest (Phase 9.5); Windows stays plaintext until its build is sorted out.
filemind-storage = { path = "../storage", features = ["encrypt"] }

[target.'cfg(windows)'.dependencies]
filemind-adapter-win = { path = "../adapter-win" }

[dev-dependencies]
walkdir.workspace = true
tempfile.workspace = true
filetime.workspace = true
chrono.workspace = true

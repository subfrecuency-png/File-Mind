[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/storage",
    "crates/ai",
    "crates/adapter-macos",
    "crates/adapter-win",
    "crates/agent",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
authors = ["Ryan Rodriguez"]
repository = "https://github.com/subfrecuency/filemind"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled", "serde_json"] }
blake3 = "1"
clap = { version = "4", features = ["derive"] }
directories = "5"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
tempfile = "3"
filetime = "0.2"
notify = "8"
pdf-extract = "0.12"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
